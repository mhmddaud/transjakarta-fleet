services:
  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transjakarta-fleet-publisher
    entrypoint: ["/app/publisher"]
    profiles:
      - tools
    environment:
      TZ: Asia/Jakarta
      MQTT_BROKER: tcp://mosquitto:1883
      VEHICLE_ID: B1234XYZ
      PUBLISH_INTERVAL_SECONDS: "2"
    depends_on:
      mosquitto:
        condition: service_started

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: transjakarta-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  rabbitmq:
    image: rabbitmq:4-management
    container_name: transjakarta-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fleet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-fleet_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: transjakarta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transjakarta-fleet-server
    restart: unless-stopped
    environment:
      TZ: Asia/Jakarta
      APP_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-fleet}:${RABBITMQ_DEFAULT_PASS:-fleet_dev_password}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: fleet.events
      RABBITMQ_QUEUE: geofence_alerts
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_CLIENT_ID: fleet-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transjakarta-fleet-consumer
    restart: unless-stopped
    entrypoint: ["/app/consumer"]
    environment:
      TZ: Asia/Jakarta
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-fleet}:${RABBITMQ_DEFAULT_PASS:-fleet_dev_password}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: fleet.events
      RABBITMQ_QUEUE: geofence_alerts
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data: